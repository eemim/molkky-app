version: 2

updates:
  # Keeps the versions of the actions in the workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # One grouped pull request per month for npm packages, to keep the noise low
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # The Node types must stay on the same major as .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # svelte-check and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
