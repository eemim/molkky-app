<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>molkky-app</title>
    <script>
      // Apply the saved dark theme before the app loads, so it never flashes light first.
      // Same key and format as src/lib/settingsStore.svelte.ts.
      try {
        var s = JSON.parse(localStorage.getItem('molkky-settings-v1') || 'null');
        if (s && s.darkMode === true) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#171a14';
        }
      } catch (e) {
        // Bad or unavailable storage: stay light, the app validates it properly on load
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
